<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Tracking</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
      }

      .product-card {
        width: 250px;
        padding: 20px;
        margin: 15px;
        border: 1px solid #ccc;
        border-radius: 10px;
        display: inline-block;
        cursor: pointer;
        transition: 0.3s;
      }

      .product-card:hover {
        transform: scale(1.03);
      }
    </style>
  </head>

  <body>
    <h1>Products</h1>

    <div
      class="product-card"
      data-product-id="P001"
      data-product-name="Gaming Laptop"
    >
      Gaming Laptop
    </div>

    <div
      class="product-card"
      data-product-id="P002"
      data-product-name="Smartphone"
    >
      Smartphone
    </div>

    <script>
      function getDeviceType() {
        const ua = navigator.userAgent;

        if (/Android|iPhone|iPad|Mobile/i.test(ua)) {
          return "mobile";
        }

        return "desktop";
      }

      function getLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve(null);
            return;
          }

          navigator.geolocation.getCurrentPosition(
            (position) => {
              resolve({
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
              });
            },

            () => {
              resolve(null);
            },

            {
              enableHighAccuracy: false,
              timeout: 5000,
              maximumAge: 300000,
            },
          );
        });
      }

      async function trackInteraction(card, eventType) {
        const location = await getLocation();

        await fetch("/api/track-hover", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            eventType: eventType,

            productId: card.dataset.productId,

            productName: card.dataset.productName,

            pageUrl: window.location.href,

            deviceType: getDeviceType(),

            screenWidth: window.innerWidth,

            screenHeight: window.innerHeight,

            location: location,
          }),
        });
      }

      document.querySelectorAll(".product-card").forEach((card) => {
        card.addEventListener("mouseenter", () => {
          trackInteraction(card, "hover");
        });

        card.addEventListener("click", () => {
          trackInteraction(card, "click");
        });

        card.addEventListener("touchstart", () => {
          trackInteraction(card, "touch");
        });
      });
    </script>
  </body>
</html>
